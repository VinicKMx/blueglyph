[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "blueglyph"
version = "0.1.0"
description = "BLE debugger and sniffer host tooling for nRF52840 capture hardware."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Blueglyph contributors" }]
keywords = ["ble", "bluetooth", "nrf52840", "sniffer", "debugger", "wireshark"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
]
dependencies = [
    "bleak>=0.22,<1",
    "pyserial>=3.5,<4",
    "rich>=13.7,<15",
    "textual>=0.86,<2",
    "typer>=0.12,<1",
]

[project.urls]
Documentation = "https://github.com/VinicKMx/blueglyph/tree/main/docs"
Issues = "https://github.com/VinicKMx/blueglyph/issues"
Source = "https://github.com/VinicKMx/blueglyph"

[project.scripts]
blueglyph = "blueglyph.cli.main:app"

[dependency-groups]
dev = [
    "hypothesis>=6.108,<7",
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blueglyph"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=blueglyph --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["blueglyph"]

